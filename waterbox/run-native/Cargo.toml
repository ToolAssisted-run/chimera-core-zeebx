[package]
name = "run-native"
version = "0.0.0"
edition = "2021"
publish = false

# The native runner: the core (../guest) built for the host and called the
# way Chimera's engine calls it. What it prints is what the sandboxed core is
# compared with.
[dependencies]
zeebx_guest = { path = "../guest" }

[profile.release]
opt-level = 2
debug = 1
